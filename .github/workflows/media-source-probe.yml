name: Probe licensed landscape footage URLs
on:
  push:
    paths:
      - ".github/workflows/media-source-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  urls:
    runs-on: ubuntu-latest
    steps:
      - name: Check response codes and media types
        shell: bash
        run: |
          urls=(
            "https://assets.mixkit.co/videos/preview/mixkit-cloudy-panorama-from-high-on-a-mountain-26104-large.mp4"
            "https://assets.mixkit.co/videos/preview/mixkit-cloudy-sky-118-large.mp4"
            "https://assets.mixkit.co/videos/preview/mixkit-highway-in-the-middle-of-a-mountain-range-4633-large.mp4"
            "https://cdn.coverr.co/videos/coverr-cinematic-snowy-mountains-7615/720p.mp4"
            "https://videos.pexels.com/video-files/2888383/2888383-hd_1280_720_24fps.mp4"
            "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
          )
          for u in "${urls[@]}"; do
            echo "SOURCE: $u"
            curl -LIs --max-time 9 -o /dev/null -w 'CODE=%{http_code}; TYPE=%{content_type}; SIZE=%{size_download}; URL=%{url_effective}\n' "$u" || echo "network unavailable"
          done
