# This workflow is intentionally inert. Do not reimport deleted WordPress URLs.
name: Retired WordPress guide sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm retired source
        run: echo "WordPress no longer hosts the public guides. GitHub Pages is the source of truth."
