name: Portfolio page review

on:
  pull_request:
    paths:
      - "portfolio/**"
      - "concepts/frame-five-contact/index.html"
      - "contact/index.html"
      - "software-skills/index.html"
      - "profile/index.html"
      - "scripts/portfolio_page_review.py"
      - ".github/workflows/portfolio-page-review.yml"
  push:
    paths:
      - "portfolio/**"
      - "concepts/frame-five-contact/index.html"
      - "contact/index.html"
      - "software-skills/index.html"
      - "profile/index.html"
      - "scripts/portfolio_page_review.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio-review:
    name: Six case studies, responsive layout and five-page navigation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify portfolio JavaScript syntax
        run: node --check portfolio/portfolio.js
      - name: Test interactive portfolio and visual layout
        run: python scripts/portfolio_page_review.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-page-screenshots
          path: screenshots/portfolio/
          retention-days: 14
          if-no-files-found: ignore
