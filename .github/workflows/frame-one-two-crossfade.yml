name: Frame 01 to 02 cinematic text transition

on:
  pull_request:
    paths:
      - "concepts/frame-five-contact/assets/journey-five.js"
      - "concepts/frame-five-contact/assets/contact-globe.css"
      - "scripts/frame_one_two_crossfade_review.py"
      - ".github/workflows/frame-one-two-crossfade.yml"
  push:
    paths:
      - "concepts/frame-five-contact/assets/journey-five.js"
      - "concepts/frame-five-contact/assets/contact-globe.css"
      - "scripts/frame_one_two_crossfade_review.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cinematic-text-crossfade:
    name: Reversible slow headline transition on four viewports
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check interaction JavaScript syntax
        run: node --check concepts/frame-five-contact/assets/journey-five.js
      - name: Test text fade and full reverse
        run: python scripts/frame_one_two_crossfade_review.py
      - name: Save transition screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-one-two-smooth-crossfade
          path: screenshots/frame-one-to-two-crossfade/
          retention-days: 14
          if-no-files-found: ignore
