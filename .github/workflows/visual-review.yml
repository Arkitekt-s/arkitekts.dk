name: Responsive visual review
on:
  push:
    paths:
      - 'concepts/**'
      - 'scripts/visual_review.py'
      - 'scripts/light_experience_review.py'
      - 'scripts/immersive_studio_review.py'
      - 'scripts/personal_journey_review.py'
      - 'scripts/stage_deck_review.py'
      - '.github/workflows/visual-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-review:
    name: Responsive browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Review 4 widths and capture screenshots
        run: python scripts/visual_review.py
      - name: Review light-theme 3D portfolio and shared templates
        run: python scripts/light_experience_review.py
      - name: Review cinematic interactive 3D studio on all screen sizes
        run: python scripts/immersive_studio_review.py
      - name: Review personal cinematic 3D site
        run: python scripts/personal_journey_review.py
      - name: Review fixed-frame stage deck at four screen sizes
        run: python scripts/stage_deck_review.py
      - name: Check stage deck JavaScript syntax
        run: node --check concepts/stage-deck/assets/stage.js
      - name: Check personal 3D JavaScript syntax
        run: node --check concepts/personal-journey/assets/personal.js
      - name: Check cinematic 3D JavaScript syntax
        run: node --check concepts/immersive-studio/assets/studio.js
      - name: Check interactive JavaScript syntax
        run: node --check concepts/light-journey/assets/experience.js
      - name: Save desktop/tablet/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-responsive-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
