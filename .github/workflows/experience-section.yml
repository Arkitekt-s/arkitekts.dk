name: Six-section experience preview review
on:
  push:
    branches: [main]
    paths:
      - 'previews/experience-section/**'
      - 'scripts/review_experience_section.py'
      - '.github/workflows/experience-section.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify real sixth section on desktop and mobile
        run: python scripts/review_experience_section.py
      - name: Upload option screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-section-review
          path: screenshots/experience-section/
          retention-days: 14
          if-no-files-found: ignore
