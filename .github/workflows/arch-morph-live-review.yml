name: Live arch unfold motion verification
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'concepts/frame-five-contact/assets/arch-morph-home.js'
      - 'concepts/frame-five-contact/assets/arch-morph-home.css'
      - 'concepts/frame-five-contact/assets/journey-five.js'
      - 'concepts/frame-five-contact/assets/frame-one-hold-scenes.js'
      - 'scripts/arch_morph_live_review.py'
      - '.github/workflows/arch-morph-live-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    name: Real page, 3 films, 4 screen sizes, forward and reverse
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check concepts/frame-five-contact/assets/arch-morph-home.js
          node --check concepts/frame-five-contact/assets/frame-one-hold-scenes.js
          node --check concepts/frame-five-contact/assets/journey-five.js
      - name: Test real one-film arch-to-fullscreen transition
        run: python scripts/arch_morph_live_review.py
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-arch-unfold-visual-checks
          path: screenshots/live-arch-unfold/
          retention-days: 14
          if-no-files-found: ignore
