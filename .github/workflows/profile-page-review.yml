name: Profile page review

on:
  pull_request:
    paths:
      - "profile/**"
      - "contact/index.html"
      - "software-skills/index.html"
      - "concepts/frame-five-contact/index.html"
      - "scripts/profile_page_review.py"
      - ".github/workflows/profile-page-review.yml"
  push:
    paths:
      - "profile/**"
      - "contact/index.html"
      - "software-skills/index.html"
      - "concepts/frame-five-contact/index.html"
      - "scripts/profile_page_review.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-review:
    name: Profile content, shared chrome, education and navigation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: JavaScript syntax
        run: node --check profile/profile.js
      - name: Review Profile on mobile, tablet and desktop
        run: python scripts/profile_page_review.py
      - name: Save responsive Profile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-page-screenshots
          path: screenshots/profile-page/
          retention-days: 14
          if-no-files-found: ignore
