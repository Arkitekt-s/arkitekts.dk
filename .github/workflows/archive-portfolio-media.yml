name: Archive original Portfolio photos and PDFs

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/archive_portfolio_media.py"
      - ".github/workflows/archive-portfolio-media.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-media:
    name: Back up six WordPress project media archives into GitHub
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out project PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source media tools
        run: python -m pip install beautifulsoup4==4.14.2 pillow pymupdf==1.26.5
      - name: Download original photos and PDFs from all six public WordPress projects
        run: python scripts/archive_portfolio_media.py
      - name: Display imported files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('portfolio/media-manifest.json').read_text())
          for k,v in j['projects'].items():
            print(k, 'IMAGES:',sum(x['kind']=='image' for x in v['files']),
                  'PDFs:',sum(x['kind']=='pdf' for x in v['files']))
          PY
      - name: Commit media, metadata and new project galleries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/assets/original/ portfolio/media-manifest.json portfolio/*/index.html
          if git diff --cached --quiet; then
            echo "All original portfolio media already archived."
          else
            git commit -m "Import original six-project WordPress media and CAMP PDF"
            git push origin HEAD:${{ github.head_ref }}
          fi
