name: Cache original Portfolio images
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/build_portfolio_images.py"
      - ".github/workflows/build-portfolio-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image-assets:
    name: Download and self-host original five project screenshots
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build optimized screenshot assets
        run: |
          python -m pip install pillow
          python scripts/build_portfolio_images.py
      - name: Commit local image assets to PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/assets/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Cache five original portfolio images locally"
            git push origin HEAD:${{ github.head_ref }}
          fi
