name: Bilingual homepage preview
on:
  push:
    branches: [main]
    paths:
      - 'previews/home-language/**'
      - 'scripts/home_language_preview_review.py'
      - '.github/workflows/home-language-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Desktop and mobile English Danish homepage checks
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check translation script syntax
        run: node --check previews/home-language/language.js
      - name: Verify both languages and the existing animated layout
        run: python scripts/home_language_preview_review.py
      - name: Save English and Danish screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-homepage-screenshots
          path: screenshots/home-language/
          retention-days: 14
          if-no-files-found: ignore
