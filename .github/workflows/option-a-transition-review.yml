name: Option A seamless homepage transition review
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'concepts/frame-five-contact/**'
      - 'concepts/frame-one-v3/assets/frame-one.css'
      - 'concepts/frame-two-portal/assets/portal.css'
      - 'scripts/option_a_transition_review.py'
      - '.github/workflows/option-a-transition-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-option-a:
    name: Real homepage forward/reverse transitions on five screen sizes
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify script syntax
        run: node --check concepts/frame-five-contact/assets/journey-five.js
      - name: Test seamless dissolve, original film, and upward reversal
        run: python scripts/option_a_transition_review.py
      - name: Save phone, tablet, desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: option-a-real-homepage-visuals
          path: screenshots/option-a-live/
          retention-days: 14
          if-no-files-found: ignore
