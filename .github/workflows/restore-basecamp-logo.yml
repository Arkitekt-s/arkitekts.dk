name: Restore original Basecamp identity
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/restore_basecamp_logo.py"
      - ".github/workflows/restore-basecamp-logo.yml"

permissions:
  contents: write

jobs:
  brand-asset:
    name: Preserve original TwentyFour artwork
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install pillow
      - name: Get original TwentyFour artwork
        run: python scripts/restore_basecamp_logo.py
      - name: Save artwork in the project branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/assets/original/basecamp-response/twentyfour-brand.webp
          if ! git diff --cached --quiet; then
            git commit -m "Archive original TwentyFour project identity artwork"
            git push origin HEAD:${{ github.head_ref }}
          fi
