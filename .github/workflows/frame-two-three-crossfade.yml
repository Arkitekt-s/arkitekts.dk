name: Frame 02 to 03 cinematic transition

on:
  pull_request:
    paths:
      - "concepts/frame-five-contact/assets/journey-five.js"
      - "concepts/frame-five-contact/assets/contact-globe.css"
      - "scripts/frame_two_three_crossfade_review.py"
      - ".github/workflows/frame-two-three-crossfade.yml"
  push:
    paths:
      - "concepts/frame-five-contact/assets/journey-five.js"
      - "concepts/frame-five-contact/assets/contact-globe.css"
      - "scripts/frame_two_three_crossfade_review.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-editorial-handoff:
    name: Frame 02 to 03 text and interaction across 4 viewports
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Syntax check
        run: node --check concepts/frame-five-contact/assets/journey-five.js
      - name: Test slow crossfade and interactive number
        run: python scripts/frame_two_three_crossfade_review.py
      - name: Save responsive crossfade screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-frame-two-three-transition
          path: screenshots/frame-two-three-crossfade/
          retention-days: 14
          if-no-files-found: ignore
