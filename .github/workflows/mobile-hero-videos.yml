name: Prepare lightweight mobile hero videos
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_mobile_hero.sh'
      - '.github/workflows/mobile-hero-videos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate mobile-quality versions of the same clips
        run: bash scripts/prepare_mobile_hero.sh
      - name: Commit only validated lightweight mobile media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos/optimized/hero-*-mobile.mp4
          git diff --cached --quiet || (git commit -m "Add fast-loading mobile editions of homepage hero movies" && git push origin HEAD:main)
