name: Bright contact page review

on:
  pull_request:
    paths:
      - "contact/**"
      - "concepts/frame-five-contact/index.html"
      - "concepts/frame-five-contact/assets/contact-globe.css"
      - "scripts/contact_page_review.py"
      - ".github/workflows/contact-page-review.yml"
  push:
    paths:
      - "contact/**"
      - "concepts/frame-five-contact/index.html"
      - "concepts/frame-five-contact/assets/contact-globe.css"
      - "scripts/contact_page_review.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bright-contact:
    name: Contact layout, actions and homepage routing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check contact scripts
        run: |
          node --check contact/contact.js
          node --check contact/home-to-contact.js
      - name: Check light contact design and navigation
        run: python scripts/contact_page_review.py
      - name: Save responsive contact review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bright-contact-review-screenshots
          path: screenshots/bright-contact/
          retention-days: 14
          if-no-files-found: ignore
