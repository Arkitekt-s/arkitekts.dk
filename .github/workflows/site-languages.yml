name: English Danish site verification
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'profile/**'
      - 'portfolio/**'
      - 'software-skills/**'
      - 'contact/**'
      - 'technical-guides/**'
      - 'it-drift/**'
      - 'assets/*language*.js'
      - 'assets/site-language.css'
      - 'scripts/verify_site_languages.py'
      - '.github/workflows/site-languages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium for visual and interaction checks
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check all public pages and Danish/English switch
        run: python scripts/verify_site_languages.py
      - name: Save screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-site-review
          path: screenshots/site-language/
          retention-days: 14
          if-no-files-found: ignore
