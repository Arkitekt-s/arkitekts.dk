name: Section 2 to 3 timing preview browser tests
on:
  push:
    branches: [main]
    paths:
      - 'previews/section-2-to-3/**'
      - 'scripts/section_2_to_3_preview_review.py'
      - '.github/workflows/section-2-to-3-preview-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timing:
    name: Verify all three options using real homepage on phone tablet desktop
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify preview JavaScript syntax
        run: node --check previews/section-2-to-3/preview-journey.js
      - name: Test A B C timing and capture screenshots
        run: python scripts/section_2_to_3_preview_review.py
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section-2-to-3-timing-choices
          path: screenshots/section-2-to-3-timing/
          retention-days: 14
          if-no-files-found: ignore
