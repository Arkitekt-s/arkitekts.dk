name: Validate website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Site integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check relative links, anchors and responsive styles
        run: python3 scripts/check_site.py
      - name: Check Danish SEO, canonical URLs and sitemap
        run: python3 scripts/check_danish_seo.py
      - name: Check JavaScript syntax
        run: node --check assets/app.js
