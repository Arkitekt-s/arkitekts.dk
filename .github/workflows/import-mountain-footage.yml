name: Import and optimize mountain footage
on:
  push:
    paths:
      - ".github/workflows/import-mountain-footage.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install media encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Get genuine licensed Pexels footage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p concepts/frame-one-live/assets
          curl -fL --retry 2 --connect-timeout 15 --max-time 90 \
            "https://videos.pexels.com/video-files/2888383/2888383-hd_1280_720_24fps.mp4" \
            -o /tmp/mountain-original.mp4
          file /tmp/mountain-original.mp4
          ls -lh /tmp/mountain-original.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json /tmp/mountain-original.mp4
          ffmpeg -hide_banner -loglevel error -y -i /tmp/mountain-original.mp4 \
            -t 12 -vf "scale='min(1280,iw)':-2,fps=24" -an -c:v libx264 \
            -preset veryfast -crf 28 -pix_fmt yuv420p -movflags +faststart \
            concepts/frame-one-live/assets/mountain-loop.mp4
          test "$(wc -c < concepts/frame-one-live/assets/mountain-loop.mp4)" -gt 150000
          ffprobe -v error -show_entries format=duration,size -of json concepts/frame-one-live/assets/mountain-loop.mp4
          ls -lh concepts/frame-one-live/assets/mountain-loop.mp4
          ffmpeg -hide_banner -loglevel error -y -i concepts/frame-one-live/assets/mountain-loop.mp4 \
            -an -c:v libvpx-vp9 -b:v 0 -crf 34 -deadline realtime -cpu-used 5 -row-mt 1 \
            -threads 2 concepts/frame-one-live/assets/mountain-loop.webm
          test "$(wc -c < concepts/frame-one-live/assets/mountain-loop.webm)" -gt 80000
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration,size -of json concepts/frame-one-live/assets/mountain-loop.webm
          ls -lh concepts/frame-one-live/assets/mountain-loop.webm
      - name: Commit optimized footage to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concepts/frame-one-live/assets/mountain-loop.mp4 concepts/frame-one-live/assets/mountain-loop.webm
          git commit -m "assets: self-host optimized licensed mountain motion video for Frame 01"
          git push origin HEAD:design/frame-one-live-video
