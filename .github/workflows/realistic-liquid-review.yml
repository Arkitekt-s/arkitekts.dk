name: Realistic liquid models preview checks
on:
  push:
    branches: [main]
    paths:
      - 'previews/realistic-liquid/**'
      - 'scripts/realistic_liquid_review.py'
      - '.github/workflows/realistic-liquid-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Chrome preview A B C actual video and elastic return
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chrome dependencies
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: node --check previews/realistic-liquid/real-liquid.js
      - name: Test all three physically rendered preview modes
        run: python scripts/realistic_liquid_review.py
      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realistic-liquid-models
          path: screenshots/realistic-liquid/
          retention-days: 14
          if-no-files-found: ignore
