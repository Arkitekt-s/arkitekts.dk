name: Public page and section performance audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'concepts/frame-five-contact/assets/arch-morph-home.js'
      - 'scripts/audit_site_performance.py'
      - '.github/workflows/performance-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chrome
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chrome
      - name: Audit all public pages, scenes and video variants
        run: python scripts/audit_site_performance.py
      - name: Save page speed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-performance-report
          path: screenshots/performance/
          retention-days: 14
          if-no-files-found: ignore
