name: Real arch morph previews on all screens
on:
  push:
    branches: [main]
    paths:
      - 'previews/arch-to-film/**'
      - 'scripts/arch_morph_preview_review.py'
      - '.github/workflows/arch-morph-preview-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  previews:
    name: Test three arch morphs on phone tablet and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check real mask morphing and interactive controls
        run: python scripts/arch_morph_preview_review.py
      - name: Upload all visual proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-morph-three-options
          path: screenshots/arch-to-film/
          retention-days: 14
          if-no-files-found: ignore
