name: Prepare streaming-ready hero videos
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_hero_videos.sh'
      - '.github/workflows/optimize-hero-videos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Transcode existing three cinematic clips for immediate streaming
        run: bash scripts/prepare_hero_videos.sh
      - name: Commit optimized media without changing site references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos/optimized/
          git diff --cached --quiet || (git commit -m "Add fast-start 1080p editions of the three homepage videos" && git push origin HEAD:main)
